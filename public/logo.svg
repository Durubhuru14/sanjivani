<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sanjivani">
  <!-- Sanjivani leaf-S: two layered leaves sweeping into an "S".
       Deep leaf = the NGO arm, bright leaf = the volunteer arm —
       together they form one continuous growth path. (spec §3)
       Full-detail cut for large renderings (README, hero, share). -->
  <g>
    <!-- upper leaf (deep green) -->
    <path
      d="M 31 34 C 20 33 13 27 13 19 C 13 10 21 4 31 5 C 39 6 46 10 48 17 C 44 13 38 11 32 12 C 24 13 20 17 20 22 C 20 27 25 31 31 34 Z"
      fill="#2A5A31"
    />
    <!-- lower leaf (bright green, layered over the upper at the crossing) -->
    <path
      d="M 31 34 C 20 33 13 27 13 19 C 13 10 21 4 31 5 C 39 6 46 10 48 17 C 44 13 38 11 32 12 C 24 13 20 17 20 22 C 20 27 25 31 31 34 Z"
      fill="#7CB56A"
      transform="rotate(180 32 32)"
    />
    <!-- leaf midrib veins — leaf texture at large sizes -->
    <path
      d="M 45 13 C 37 8 27 7.5 19.5 12.5"
      fill="none"
      stroke="#EBF1E0"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M 45 13 C 37 8 27 7.5 19.5 12.5"
      fill="none"
      stroke="#EBF1E0"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.6"
      transform="rotate(180 32 32)"
    />
  </g>
</svg>
