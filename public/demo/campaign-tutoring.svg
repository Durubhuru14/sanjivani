<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="After-school tutoring">
  <!-- warm tint ground -->
  <rect width="640" height="240" fill="#E8F5E9"/>
  <!-- soft sun wash, top-right -->
  <circle cx="524" cy="56" r="82" fill="#DFA737" opacity="0.12"/>
  <circle cx="524" cy="56" r="13" fill="#DFA737" opacity="0.75"/>
  <g stroke="#DFA737" stroke-width="3.2" stroke-linecap="round" opacity="0.55">
    <line x1="524" y1="34" x2="524" y2="26"/>
    <line x1="500" y1="42" x2="494" y2="36"/>
    <line x1="548" y1="42" x2="554" y2="36"/>
    <line x1="498" y1="66" x2="490" y2="70"/>
    <line x1="550" y1="66" x2="558" y2="70"/>
  </g>
  <!-- the open book — knowledge as soil -->
  <g>
    <!-- pages -->
    <path d="M320 158 C 268 140, 208 138, 160 150 C 158 170, 160 186, 164 196 C 212 184, 272 186, 320 202 Z" fill="#FFFDF7" stroke="#1B5E20" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M320 158 C 372 140, 432 138, 480 150 C 482 170, 480 186, 476 196 C 428 184, 368 186, 320 202 Z" fill="#FFFDF7" stroke="#1B5E20" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- page lines -->
    <g stroke="#66BB6A" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
      <path d="M196 162 C 232 156, 272 158, 300 166"/>
      <path d="M200 176 C 234 170, 270 172, 296 180"/>
      <path d="M204 190 C 236 184, 268 186, 292 192"/>
      <path d="M340 166 C 368 158, 408 156, 444 162"/>
      <path d="M344 180 C 372 172, 406 172, 440 176"/>
      <path d="M348 192 C 376 186, 404 186, 436 190"/>
    </g>
    <!-- spine -->
    <path d="M320 158 L 320 202" stroke="#1B5E20" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <!-- the sprout growing from the spine -->
  <g>
    <path d="M320 152 C 319 130, 321 108, 320 88" fill="none" stroke="#1B5E20" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M319.4 128 C 300 126, 286 114, 282 96 C 300 99, 314.5 110, 319.4 128 Z" fill="#2E7D32"/>
    <path d="M320.8 122 C 340 119, 354 107, 358 89 C 340 92, 325.5 103, 320.8 122 Z" fill="#66BB6A"/>
    <!-- the bud -->
    <path d="M320 88 C 315 81, 315 72, 320 65 C 325 72, 325 81, 320 88 Z" fill="#2E7D32"/>
    <circle cx="320" cy="54" r="3.2" fill="#DFA737"/>
  </g>
  <!-- sparkles of understanding -->
  <g stroke="#DFA737" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M242 96 v9 M237.5 100.5 h9"/>
    <path d="M404 84 v7 M400.5 87.5 h7"/>
    <path d="M178 92 v6 M175 95 h6" opacity="0.6"/>
  </g>
  <!-- a pencil resting by the book -->
  <g transform="rotate(14 130 196)">
    <rect x="96" y="190" width="56" height="9" rx="4.5" fill="#DFA737"/>
    <path d="M152 190 l12 4.5 l-12 4.5 Z" fill="#AA542E"/>
    <rect x="96" y="190" width="8" height="9" rx="4" fill="#FFFDF7" opacity="0.7"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="320" cy="208" rx="150" ry="9" fill="#1B5E20" opacity="0.08"/>
</svg>
