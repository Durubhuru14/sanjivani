project_id = "sanjivani"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "auth"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54329
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 200

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Email confirmation is deliberately OFF for this project (spec §6):
# signup logs the user in immediately — no email provider needed for the demo.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# IMPORTANT: also disable "Confirm email" in the hosted dashboard:
# Auth → Providers → Email → Confirm email OFF
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "2MiB"
